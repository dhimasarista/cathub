[package]
name = "cathub"
version = "0.1.0"
edition = "2021"
description = "All-in-One Deterministic IIoT Realtime Hub"
authors = ["Dhimasarista"]

[dependencies]
# Web Framework (Broadcaster)
actix-web = "4"

# Async Runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# MQTT (Embedded Broker)
rumqttd = "0.18"

# Database (Vault) - Support for Postgres, MySQL, SQLite
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "any", "postgres", "mysql", "sqlite", "chrono"] }
dotenvy = "0.15"

# Serialization & Utils
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
